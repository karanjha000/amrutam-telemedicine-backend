# Default server for the Amrutam frontend.
#
# The static bundle is served from /usr/share/nginx/html. All API traffic
# (/api, /graphql, /swagger-ui, /v3/api-docs) is proxied to the backend
# service. The backend host is injected at build time via the Docker
# build-arg/env AMRUTAM_API_HOST (default "backend:8080"), so the same
# image works against the compose service name in production and a local
# backend during development.

# nginx does not read environment variables at runtime; the build step
# substitutes ${AMRUTAM_API_HOST} when the config is rendered. The build
# stage of the Dockerfile bakes this into the file it copies in.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths that are not API calls land on React.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset cache.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # REST API.
    location /api/ {
        proxy_pass http://${AMRUTAM_API_HOST};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GraphQL.
    location /graphql {
        proxy_pass http://${AMRUTAM_API_HOST};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI / Swagger UI.
    location /swagger-ui {
        proxy_pass http://${AMRUTAM_API_HOST};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        proxy_pass http://${AMRUTAM_API_HOST};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
