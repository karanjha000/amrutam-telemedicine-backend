#!/bin/sh
# Renders the nginx config template with the AMRUTAM_API_HOST env var.
# Runs from the official nginx image entrypoint (docker-entrypoint.d/*).
#
# The template lives at /etc/nginx/templates/*.conf.template; nginx's
# default entrypoint auto-renders it with `envsubst` into
# /etc/nginx/conf.d/. We add an explicit step so the behavior is
# deterministic regardless of the entrypoint version.

TEMPLATE=/etc/nginx/templates/default.conf.template
DEST=/etc/nginx/conf.d/default.conf

if [ -f "$TEMPLATE" ]; then
    # Substitute only AMRUTAM_API_HOST so $host/$remote_addr/etc. in the
    # proxy directives are preserved.
    envsubst '${AMRUTAM_API_HOST}' < "$TEMPLATE" > "$DEST"
    echo "Rendered nginx config with AMRUTAM_API_HOST=${AMRUTAM_API_HOST}" >&2
fi
