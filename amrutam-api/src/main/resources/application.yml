spring:
  application:
    name: amrutam-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:amrutam}
    username: ${DB_USER:amrutam}
    password: ${DB_PASSWORD:amrutam}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 4
      pool-name: amrutam-hikari
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  sql:
    init:
      mode: ${AMRUTAM_SQL_INIT:always}
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  graphql:
    graphiql:
      enabled: true

server:
  port: 8080
  error:
    include-message: always

amrutam:
  jwt:
    # DEV-ONLY placeholder. Production MUST override via JWT_SECRET
    # (see application-prod.yml). HMAC-SHA256 secret; rotated in two-secret
    # overlap (docs/SECURITY.md).
    secret: amrutam-dev-hmac-secret-change-me-0123456789abcdef
    issuer: amrutam
    ttl-seconds: 900
  api:
    schema-init: ${AMRUTAM_SQL_INIT:always}
  cache:
    redis-enabled: true
  ratelimit:
    default-qps: 20
    default-burst: 40

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  base-path: /actuator

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.amrutam: INFO
