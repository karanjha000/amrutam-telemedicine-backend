# Test profile: H2 (PostgreSQL mode) in-memory database, no Redis.
#
# schema-h2.sql is an H2-compatible mirror of schema.sql (gen_random_uuid()
# is unavailable in H2; H2 2.x supports the uuid type natively, so no
# DEFAULT expression is needed — JPA @GeneratedValue fills ids).
#
# data-h2.sql is intentionally empty: tests create their own fixtures
# programmatically via repositories in @BeforeEach; the "seeded doctor
# exists" check is done by asserting against test-created rows, never
# against data.sql rows.
spring:
  datasource:
    url: jdbc:h2:mem:amrutam_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data-h2.sql
      continue-on-error: true

  data:
    redis:
      host: localhost
      port: 6379

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

amrutam:
  cache:
    redis-enabled: false
  jwt:
    secret: test-hmac-secret-amrutam-0123456789abcdef0123456789abcdef01
    issuer: amrutam
    ttl-seconds: 900
    clock-skew-seconds: 30
  idempotency:
    salt: amrutam-booking

logging:
  level:
    com.amrutam: DEBUG
