spring:
  datasource:
    url: jdbc:h2:mem:workers_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  sql:
    init:
      mode: always
      schema-locations: "classpath:schema-test.sql"

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: none

amrutam:
  workers:
    enabled: true
    poll-interval-ms: 1
    saga-reconciliation-interval-ms: 60000
