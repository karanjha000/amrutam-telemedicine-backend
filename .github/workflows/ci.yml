name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install (skip tests)
        run: mvn -B -ntp -f backend/pom.xml clean install -DskipTests

      - name: Run tests
        run: mvn -B -ntp -f backend/pom.xml test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dependency vulnerability scan
        run: |
          mvn -B -ntp -f backend/pom.xml org.owasp:dependency-check-maven:check -DfailOnError=false

  container:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: |
          docker buildx build --load -t amrutam:${{ github.sha }} .

      - name: Verify image exists
        run: |
          docker image inspect amrutam:${{ github.sha }} >/dev/null

  deploy-check:
    runs-on: ubuntu-latest
    needs: container
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Deployment readiness check
        run: |
          chmod +x scripts/deploy-check.sh
          ./scripts/deploy-check.sh
