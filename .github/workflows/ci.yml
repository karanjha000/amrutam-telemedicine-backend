        run: |
          echo "TODO: run mvn org.owasp:dependency-check-maven:check -DfailOnError=false"
          echo "No SCA tooling configured yet; this step is a no-op placeholder."

  container:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build container image (no push)
        run: |
          docker buildx build --load -t amrutam:${{ github.sha }} .

      # Placeholder: push to a registry in a follow-up.
