# Production profile:
# - JWT secret is REQUIRED (no dev placeholder fallback)
# - schema.sql stays in place (mode=always); a managed-migration module is a
#   future step (docs/ARCHITECTURE.md §Partitions & Migrations)
# - Redis pointed at the service-mesh / sidecar host
# - forward-headers-strategy: framework so the TLS-terminating proxy's
#   X-Forwarded-* are honored (Secure cookies, correct client IPs in audit)
#
# Activate with: SPRING_PROFILES_ACTIVE=prod
spring:
  # Datasource from the platform (URL/credentials injected by the orchestrator)
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  sql:
    init:
      mode: always
  forward-headers-strategy: framework

server:
  forward-headers-strategy: framework

amrutam:
  jwt:
    # REQUIRED in prod: a strong, randomly generated HMAC-SHA256 secret.
    # During rotation, keep the previous secret in legacy-secret while the
    # overlap window expires old tokens (docs/SECURITY.md §Key Rotation).
    secret: ${JWT_SECRET}
    legacy-secret: ${JWT_LEGACY_SECRET:}
    issuer: amrutam
    ttl-seconds: 900
  cache:
    redis-enabled: true

management:
  metrics:
    tags:
      service: amrutam-api
  endpoints:
    web:
      exposure:
        # prod: keep actuator surface minimal; prometheus + health for
        # platform scraping/liveness.
        include: health,prometheus

logging:
  level:
    com.amrutam: INFO
