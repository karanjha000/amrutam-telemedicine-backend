# Amrutam local development / reference deployment.
#
# The api and workers services use the SAME multi-role image (built from the
# root Dockerfile) and differ only by AMRUTAM_ROLE + role-specific env.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amrutam
      POSTGRES_USER: amrutam
      POSTGRES_PASSWORD: amrutam
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=3
      - -c
      - hot_standby=on
      - -c
      - archive_mode=on
      - -c
      - archive_command=cp %p /var/lib/postgresql/archive/%f
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgarchive:/var/lib/postgresql/archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amrutam -d amrutam"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: amrutam:local
    environment:
      AMRUTAM_ROLE: api
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/amrutam
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/amrutam
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: amrutam
      DB_USER: amrutam
      DB_PASSWORD: amrutam
      REDIS_HOST: redis
      # Dev-only placeholder; set a real secret in any real deployment.
      JWT_SECRET: amrutam-dev-hmac-secret-change-me-0123456789abcdef
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      AMRUTAM_API_HOST: api:8080
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

  workers:
    image: amrutam:local
    # Same multi-role image; the entrypoint runs /app/workers.jar.
    environment:
      AMRUTAM_ROLE: workers
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/amrutam
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/amrutam
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: amrutam
      DB_USER: amrutam
      DB_PASSWORD: amrutam
      REDIS_HOST: redis
      AMRUTAM_WORKERS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  pgarchive:
  redisdata:

networks:
  default:
    driver: bridge
